name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/resolve-places.mjs
        env:
          EXPO_PUBLIC_SHEETS_ID: ${{ secrets.SHEETS_ID }}
          EXPO_PUBLIC_SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
      # Os dados vão criptografados para public/data.enc.json; a chave e o ID não entram no JavaScript do site.
      - run: node scripts/build-data.mjs
        env:
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_USE_SNAPSHOT: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
