name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Opcional: resolve links do Maps e baixa imagens do Drive; sem os segredos o passo só é ignorado.
      - run: node scripts/resolve-places.mjs
        env:
          EXPO_PUBLIC_SHEETS_ID: ${{ secrets.SHEETS_ID }}
          EXPO_PUBLIC_SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
      # Só a URL do Web App vai para o site; a senha e a planilha ficam no Google.
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SCRIPT_URL: ${{ vars.SCRIPT_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
